name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript 编译检查 ─────────────────────────────────────
  ts-compile:
    name: TypeScript Compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: services/executor, name: executor }
          - { path: services/code-generator, name: code-generator }
          - { path: services/spec-normalizer, name: spec-normalizer }
          - { path: frontend/vscode-plugin, name: vscode-plugin }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: ${{ matrix.service.path }}
      - name: Type check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.service.path }}

  # ── 端到端逻辑验证（不依赖 Docker） ────────────────────────
  e2e-test:
    name: E2E Logic Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run e2e test (Mock LLM)
        run: node scripts/e2e-test.js

  # ── 知识库索引验证 ──────────────────────────────────────────
  knowledge-base:
    name: Knowledge Base Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild index (dry-run)
        run: node knowledge-base/scripts/build-index.js --dry-run
      - name: Validate kb.json exists and is valid
        run: node -e "const kb=require('./knowledge-base/index/kb.json'); if(!kb.totalChunks) throw new Error('empty kb'); console.log('chunks:', kb.totalChunks)"

  # ── Docker 构建验证 ─────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { context: ".", dockerfile: services/executor/Dockerfile, name: executor }
          - { context: ".", dockerfile: services/code-generator/Dockerfile, name: code-generator }
          - { context: ".", dockerfile: services/spec-normalizer/Dockerfile, name: spec-normalizer }
          - { context: services/memory, dockerfile: services/memory/Dockerfile, name: memory }
          - { context: services/admin, dockerfile: services/admin/Dockerfile, name: admin }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service.name }}
        run: docker build -f ${{ matrix.service.dockerfile }} ${{ matrix.service.context }} --tag awp-${{ matrix.service.name }}:ci

  # ── 集成测试（Docker Compose） ──────────────────────────────
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        run: cp .env.example .env
      - name: Start infrastructure
        run: docker compose up -d redis postgres kafka zookeeper
      - name: Wait for services
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U awp -d ai_workflow && break
            sleep 2
          done
          echo "Waiting for Kafka..."
          for i in $(seq 1 30); do
            docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1 && break
            sleep 2
          done
      - name: Verify database schema
        run: |
          docker compose exec -T postgres psql -U awp -d ai_workflow -c "\dt" | grep -q "feature_specs"
          echo "✅ Database schema initialized"
      - name: Cleanup
        if: always()
        run: docker compose down -v
