<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWP 管理后台</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0a0c10;color:#c8cdd6}
  input,select,textarea{font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:#5b8cff!important}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0d1018}
  ::-webkit-scrollbar-thumb{background:#2a3550;border-radius:3px}
  table{width:100%;border-collapse:collapse}
  code{font-family:monospace}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── 配置 ────────────────────────────────────────────────────
const API_BASE = window.__AWP_API__ || 'http://localhost:3006/api/admin';
// 优先取 localStorage 手动设置的 Key，其次用服务端注入的 Key
const ADMIN_KEY = localStorage.getItem('awp_admin_key') || window.__AWP_KEY__ || '';


// PostgreSQL TEXT[] 格式 {a,b} → JS 数组
function pgArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v !== 'string') return [];
  const inner = v.replace(/^{|}$/g,'');
  if (!inner) return [];
  const result=[], len=inner.length;
  let cur='', inQ=false;
  for(let i=0;i<len;i++){
    const c=inner[i];
    if(c==='"'&&inner[i-1]!=='\\'){inQ=!inQ;continue}
    if(c===','&&!inQ){result.push(cur);cur='';continue}
    cur+=c;
  }
  if(cur!=='')result.push(cur);
  return result;
}

// ── 主题 ────────────────────────────────────────────────────
const T = {
  bg0:'#0a0c10',bg1:'#0d1018',bg2:'#111620',bg3:'#161c28',
  border:'#1e2430',border2:'#2a3550',
  text1:'#e2e6ee',text2:'#c8cdd6',text3:'#8899aa',text4:'#3a4a5a',
  blue:'#5b8cff',blueBg:'#1a2236',blueBorder:'#2a3550',
  green:'#4ade80',greenBg:'#0f2a1f',greenBorder:'#1e4a30',
  amber:'#f59e0b',red:'#f87171',purple:'#a78bfa',
};

// ── API ──────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = {
    'Content-Type': 'application/json',
    'X-Developer-ID': 'admin',
    ...(ADMIN_KEY ? {'X-Admin-Key': ADMIN_KEY} : {}),
    ...(opts.headers || {})
  };
  let r;
  try {
    r = await fetch(API_BASE + path, { ...opts, headers });
  } catch(e) {
    throw new Error(`无法连接后台服务 (${API_BASE})，请确认 admin 服务已启动`);
  }
  const json = await r.json();
  if (!json.success) throw new Error(json.error || '请求失败');
  return json.data;
}

// ── 通用 UI 组件 ─────────────────────────────────────────────
const H1 = ({children}) => <h1 style={{fontSize:20,fontWeight:700,color:T.text1,marginBottom:16}}>{children}</h1>;
const Label = ({children}) => <div style={{fontSize:11,color:T.text4,marginBottom:4,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>{children}</div>;
const Tag = ({children,color,style:s}) => <span style={{fontSize:10,padding:'2px 6px',borderRadius:3,background:color+'22',border:`1px solid ${color}44`,color,...s}}>{children}</span>;

const Toggle = ({on,disabled,onToggle}) => (
  <div onClick={disabled?undefined:onToggle} style={{width:32,height:18,borderRadius:9,background:on?T.green:T.bg3,border:`1px solid ${on?T.greenBorder:T.border}`,cursor:disabled?'not-allowed':'pointer',position:'relative',transition:'all 0.2s',flexShrink:0}}>
    <div style={{width:12,height:12,borderRadius:'50%',background:'white',position:'absolute',top:2,left:on?16:2,transition:'left 0.2s'}}/>
  </div>
);

const Btn = ({children,onClick,style:s}) => (
  <button onClick={onClick} style={{background:T.blueBg,border:`1px solid ${T.blueBorder}`,color:T.blue,padding:'7px 16px',borderRadius:6,cursor:'pointer',fontSize:13,fontWeight:500,...s}}>{children}</button>
);
const SmallBtn = ({children,onClick,disabled,style:s}) => (
  <button onClick={onClick} disabled={disabled} style={{background:T.bg3,border:`1px solid ${T.border}`,color:disabled?T.text4:T.text2,padding:'3px 9px',borderRadius:4,cursor:disabled?'not-allowed':'pointer',fontSize:11,...s}}>{children}</button>
);
const Card = ({title,children,style:s}) => (
  <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:16,...s}}>
    <div style={{fontSize:12,fontWeight:600,color:T.text4,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>{title}</div>
    {children}
  </div>
);
const Row = ({children}) => <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>{children}</div>;

const inputStyle = {width:'100%',background:T.bg0,border:`1px solid ${T.border}`,color:T.text2,padding:'7px 10px',borderRadius:5,fontSize:13,boxSizing:'border-box'};

const Field = ({label,value,onChange,disabled,type,step,placeholder}) => (
  <div>
    <Label>{label}</Label>
    <input value={value??''} onChange={onChange} disabled={disabled} type={type||'text'} step={step} placeholder={placeholder}
      style={{...inputStyle,opacity:disabled?0.5:1}}/>
  </div>
);
const SelectF = ({label,value,onChange,options}) => (
  <div>
    <Label>{label}</Label>
    <select value={value??''} onChange={onChange} style={{...inputStyle}}>
      {options.map(o=><option key={o} value={o}>{o||'（无）'}</option>)}
    </select>
  </div>
);
const Textarea = ({label,value,onChange,rows,mono}) => (
  <div>
    <Label>{label}</Label>
    <textarea value={value??''} onChange={onChange} rows={rows||4}
      style={{...inputStyle,fontSize:12,fontFamily:mono?'monospace':'inherit',resize:'vertical'}}/>
  </div>
);
const Modal = ({title,children,onClose,wide}) => (
  <div style={{position:'fixed',inset:0,background:'#0008',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div style={{background:T.bg1,border:`1px solid ${T.border}`,borderRadius:10,padding:24,width:wide?700:480,maxHeight:'85vh',overflow:'auto'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <strong style={{color:T.text1,fontSize:15}}>{title}</strong>
        <button onClick={onClose} style={{background:'none',border:'none',color:T.text4,cursor:'pointer',fontSize:18}}>×</button>
      </div>
      {children}
    </div>
  </div>
);

// ── 工具函数 ─────────────────────────────────────────────────
function providerColor(t) {
  return ({anthropic:'#ff6b35',openai:'#10a37f',deepseek:'#1a6aff',gemini:'#4285f4',qwen:'#ff6a00',zhipu:'#7b68ee',ollama:'#4ade80'})[t]||T.text4;
}
function catLabel(cat) {
  return ({general:'通用配置',llm:'LLM 模型',security:'安全配置',feature_flags:'功能开关'})[cat]||cat;
}

// ── 总览 ─────────────────────────────────────────────────────
function OverviewTab({stats}) {
  const [detail, setDetail] = useState(null);
  const [detailData, setDetailData] = useState(null);

  const cards = [
    {label:'7天新需求',value:stats?.specs_7d??'...',color:T.blue,key:'specs'},
    {label:'执行中',value:stats?.tasks?.running??0,color:T.amber,key:'running'},
    {label:'待 Review',value:stats?.tasks?.test_pass??0,color:T.green,key:'test_pass'},
    {label:'知识库条目',value:stats?.kb?.total??'...',color:T.purple,key:'kb'},
    {label:'启用 Agent',value:stats?.agents?.enabled!==undefined?parseInt(stats.agents.enabled):'...',color:T.blue,key:'agents'},
    {label:'启用 Skill',value:stats?.skills?.enabled!==undefined?parseInt(stats.skills.enabled):'...',color:T.green,key:'skills'},
  ];

  const loadDetail = async (key) => {
    if (key === 'specs') return; // specs 无详情
    setDetail(key);
    try {
      let data = [];
      if (key === 'running' || key === 'test_pass') {
        const q = new URLSearchParams({status: key, limit: '5'});
        const r = await api(`/tasks?${q}`);
        data = r.items || [];
      } else if (key === 'agents') {
        data = await api('/agents');
        data = Array.isArray(data) ? data : [];
      } else if (key === 'skills') {
        data = await api('/skills');
        data = Array.isArray(data) ? data : [];
      } else if (key === 'kb') {
        const q = new URLSearchParams({limit: '10'});
        const r = await api(`/kb?${q}`);
        data = r.items || [];
      }
      setDetailData(data);
    } catch(e) {
      window.__showToast?.(e.message, 'error');
      setDetail(null);
    }
  };

  const detailLabels = {
    running: '执行中的任务',
    test_pass: '待 Review 的任务',
    agents: 'Agent 列表',
    skills: 'Skill 列表',
    kb: '知识库条目'
  };

  return (
    <div>
      <H1>系统总览</H1>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:24}}>
        {cards.map(c=>(
          <div key={c.label} onClick={()=>loadDetail(c.key)}
            style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:'16px 20px',cursor:'pointer',transition:'all 0.2s'}}>
            <div style={{fontSize:28,fontWeight:700,color:c.color}}>{c.value}</div>
            <div style={{fontSize:12,color:T.text4,marginTop:4}}>{c.label}</div>
          </div>
        ))}
      </div>
      {stats?.kb?.byLanguage&&(
        <Card title="知识库语言分布">
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            {Object.entries(stats.kb.byLanguage).map(([lang,count])=>(
              <Tag key={lang} color={T.blue}>{lang}: {count}</Tag>
            ))}
          </div>
        </Card>
      )}
      {detail&&detailData&&(
        <Modal title={detailLabels[detail]} onClose={()=>setDetail(null)} wide>
          {(detail==='running'||detail==='test_pass')&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {detailData.length===0?<div style={{color:T.text4}}>暂无</div>:
                detailData.map(t=>(
                  <div key={t.id} style={{background:T.bg0,border:`1px solid ${T.border}`,borderRadius:6,padding:'12px 16px'}}>
                    <div style={{color:T.text1,fontWeight:500}}>{t.spec_title}</div>
                    <div style={{fontSize:11,color:T.text4,marginTop:4}}>{t.id.slice(0,8)} · {fmtTime(t.created_at)}</div>
                  </div>
                ))
              }
            </div>
          )}
          {(detail==='agents'||detail==='skills')&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {detailData.length===0?<div style={{color:T.text4}}>暂无</div>:
                detailData.slice(0,10).map(item=>(
                  <div key={item.id||item.name} style={{background:T.bg0,border:`1px solid ${T.border}`,borderRadius:6,padding:'12px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{color:T.text1,fontWeight:500}}>{item.display_name||item.name}</div>
                      <div style={{fontSize:11,color:T.text4,marginTop:2}}>{item.description?.slice(0,60)||'—'}</div>
                    </div>
                    {(item.enabled==='true'||item.enabled===true)?<Tag color={T.green}>启用</Tag>:<Tag color={T.red}>禁用</Tag>}
                  </div>
                ))
              }
            </div>
          )}
          {detail==='kb'&&(
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {detailData.length===0?<div style={{color:T.text4}}>暂无</div>:
                detailData.map(e=>(
                  <div key={e.id} style={{background:T.bg0,border:`1px solid ${T.border}`,borderRadius:6,padding:'12px 16px'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                      <span style={{color:T.text1,fontWeight:500}}>{e.title}</span>
                      {e.language&&<Tag color={T.blue}>{e.language}</Tag>}
                      <span style={{fontSize:11,color:T.text4}}>质量 {e.quality_score}</span>
                    </div>
                  </div>
                ))
              }
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

// ── LLM 配置 ─────────────────────────────────────────────────
function LLMTab() {
  const [providers,setProviders] = useState([]);
  const [form,setForm] = useState(null);
  const [testing,setTesting] = useState(null);
  const [testResult,setTestResult] = useState({});
  const [showOthers, setShowOthers] = useState(false);
  const TYPES = ['anthropic','openai','deepseek','gemini','qwen','zhipu','ollama','azure','custom'];

  const load = () => api('/llm-providers').then(setProviders).catch(e=>window.__showToast?.(e.message));
  useEffect(()=>{load()},[]);

  const testProvider = async (name) => {
    setTesting(name);
    try {
      const r = await api('/llm/test',{method:'POST',body:JSON.stringify({providerName:name})});
      setTestResult(p=>({...p,[name]:r}));
    } catch(e) {
      setTestResult(p=>({...p,[name]:{ok:false,error:e.message}}));
    }
    setTesting(null);
  };

  const setDefault = async (name) => {
    try {
      // 先取消其他默认设置
      for (const p of providers.filter(pr => (pr.is_default==='true'||pr.is_default===true) && pr.name !== name)) {
        await api(`/llm-providers/${p.name}`,{method:'PUT',body:JSON.stringify({is_default:false})});
      }
      // 再设置新的默认
      await api(`/llm-providers/${name}`,{method:'PUT',body:JSON.stringify({is_default:true})});
      load();
      window.__showToast?.('已设置为默认模型','ok');
    } catch(e) {
      window.__showToast?.(e.message,'error');
    }
  };

  const toggleEnabled = async (name, currentEnabled) => {
    try {
      await api(`/llm-providers/${name}`,{method:'PUT',body:JSON.stringify({enabled:!currentEnabled})});
      load();
    } catch(e) {
      window.__showToast?.(e.message,'error');
    }
  };

  const defaultProviders = providers.filter(p=>['anthropic','openai'].includes(p.provider_type));
  const otherProviders = providers.filter(p=>!['anthropic','openai'].includes(p.provider_type));

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <H1>LLM 模型配置</H1>
        <Btn onClick={()=>setForm({provider_type:'openai',max_output_tokens:8192,context_window:128000})}>+ 添加自定义模型</Btn>
      </div>
      {providers.length===0&&<div style={{color:T.text3,padding:32,textAlign:'center',background:T.bg2,borderRadius:8,border:`1px solid ${T.border}`}}>暂无 LLM 模型配置，点击右上角「+ 添加自定义模型」</div>}

      {defaultProviders.length>0&&(
        <div style={{marginBottom:32}}>
          <Label style={{marginBottom:16}}>推荐模型（点击卡片切换为默认）</Label>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:16}}>
            {defaultProviders.map(p=>(
              <div key={p.name} onClick={()=>setDefault(p.name)}
                style={{background:T.bg2,border:`2px solid ${p.is_default==='true'||p.is_default===true?T.blue:T.border}`,borderRadius:8,padding:'16px',cursor:'pointer',transition:'all 0.2s',opacity:(p.enabled==='false'||p.enabled===false)?0.5:1}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'start',marginBottom:12}}>
                  <div>
                    <strong style={{color:T.text1,fontSize:14}}>{p.display_name}</strong>
                    <div style={{fontSize:11,color:T.text4,marginTop:4}}>{p.model_id}</div>
                  </div>
                  {(p.is_default==='true'||p.is_default===true)&&<Tag color={T.green}>默认</Tag>}
                </div>
                <div style={{fontSize:12,color:T.text3,marginBottom:12}}>上下文 {Math.round((parseInt(p.context_window)||0)/1000)}K · 输出 {Math.round((parseInt(p.max_output_tokens)||0)/1000)}K</div>
                {testResult[p.name]&&(
                  <div style={{fontSize:11,marginBottom:10,color:testResult[p.name].ok?T.green:T.red}}>
                    {testResult[p.name].ok?`✓ ${testResult[p.name].latencyMs}ms`:`✗ ${testResult[p.name].error}`}
                  </div>
                )}
                <div style={{display:'flex',gap:6}}>
                  <SmallBtn onClick={e=>{e.stopPropagation();testProvider(p.name)}} disabled={testing===p.name} style={{flex:1}}>
                    {testing===p.name?'测试中...':'测试'}
                  </SmallBtn>
                  <SmallBtn onClick={e=>{e.stopPropagation();toggleEnabled(p.name,p.enabled==='true'||p.enabled===true)}} style={{flex:1,color:(p.enabled==='false'||p.enabled===false)?T.red:T.green}}>
                    {(p.enabled==='false'||p.enabled===false)?'启用':'禁用'}
                  </SmallBtn>
                  <SmallBtn onClick={e=>{e.stopPropagation();setForm(p)}} style={{flex:1}}>编辑</SmallBtn>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {otherProviders.length>0&&(
        <div>
          <div onClick={()=>setShowOthers(!showOthers)} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginBottom:12,padding:'8px 0'}}>
            <span style={{fontSize:11,color:T.text4,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>其他模型 ({otherProviders.length})</span>
            <span style={{color:T.text4}}>{showOthers?'▼':'▶'}</span>
          </div>
          {showOthers&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {otherProviders.map(p=>(
                <div key={p.name} onClick={()=>setDefault(p.name)}
                  style={{background:T.bg2,border:`2px solid ${p.is_default==='true'||p.is_default===true?T.blue:T.border}`,borderRadius:8,padding:'12px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer',transition:'all 0.2s'}}>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                      <strong style={{color:T.text1}}>{p.display_name}</strong>
                      <Tag color={providerColor(p.provider_type)}>{p.provider_type}</Tag>
                      {(p.is_default==='true'||p.is_default===true)&&<Tag color={T.green}>默认</Tag>}
                      {(p.enabled==='false'||p.enabled===false)&&<Tag color={T.red}>已禁用</Tag>}
                    </div>
                    <div style={{fontSize:12,color:T.text4,marginTop:4}}>{p.model_id} · 上下文 {Math.round((parseInt(p.context_window)||0)/1000)}K</div>
                  </div>
                  <div style={{display:'flex',gap:8,flexShrink:0}}>
                    <SmallBtn onClick={e=>{e.stopPropagation();testProvider(p.name)}} disabled={testing===p.name}>{testing===p.name?'测试中...':'测试'}</SmallBtn>
                    <SmallBtn onClick={e=>{e.stopPropagation();toggleEnabled(p.name,p.enabled==='true'||p.enabled===true)}}>{(p.enabled==='true'||p.enabled===true)?'禁用':'启用'}</SmallBtn>
                    <SmallBtn onClick={e=>{e.stopPropagation();setForm(p)}}>编辑</SmallBtn>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
      {form&&(
        <Modal title={form.id?'编辑模型':'添加模型'} onClose={()=>setForm(null)}>
          <LLMForm initial={form} providerTypes={TYPES} onSave={async(d)=>{
            if(form.id) await api(`/llm-providers/${form.name}`,{method:'PUT',body:JSON.stringify(d)});
            else await api('/llm-providers',{method:'POST',body:JSON.stringify(d)});
            setForm(null);load();window.__showToast?.('保存成功','ok');
          }}/>
        </Modal>
      )}
    </div>
  );
}

function LLMForm({initial,providerTypes,onSave}) {
  const [d,setD] = useState({...initial});
  const f = k => e => setD(p=>({...p,[k]:e.target.value}));
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <Row><Field label="名称(唯一)" value={d.name||''} onChange={f('name')} disabled={!!initial.id}/>
           <Field label="显示名称" value={d.display_name||''} onChange={f('display_name')}/></Row>
      <Row><SelectF label="Provider 类型" value={d.provider_type||''} onChange={f('provider_type')} options={providerTypes}/>
           <Field label="Model ID" value={d.model_id||''} onChange={f('model_id')}/></Row>
      <Field label="Base URL (可选)" value={d.base_url||''} onChange={f('base_url')}/>
      <Row><Field label="API Key 环境变量名" value={d.api_key_env||''} onChange={f('api_key_env')} placeholder="如 OPENAI_API_KEY"/>
           <Field label="或直接填 API Key" value={d.api_key_value||''} onChange={f('api_key_value')} type="password"/></Row>
      <Row><Field label="上下文长度" value={d.context_window||128000} onChange={f('context_window')} type="number"/>
           <Field label="最大输出 Token" value={d.max_output_tokens||8192} onChange={f('max_output_tokens')} type="number"/></Row>
      <div style={{display:'flex',justifyContent:'flex-end'}}><Btn onClick={()=>onSave(d)}>保存</Btn></div>
    </div>
  );
}

// ── Skills ───────────────────────────────────────────────────
function SkillsTab() {
  const [skills,setSkills] = useState([]);
  const [form,setForm] = useState(null);
  const [viewing,setViewing] = useState(null);
  const EXEC_TYPES = ['llm_prompt','builtin_fn','http_webhook','js_script'];
  const load = () => api('/skills').then(setSkills).catch(e=>window.__showToast?.(e.message));
  useEffect(()=>{load()},[]);

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <H1>Skill 管理</H1>
        <Btn onClick={()=>setForm({executor_type:'llm_prompt',category:'custom',temperature:0.2,max_tokens:4096})}>+ 添加 Skill</Btn>
      </div>
      <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,overflow:'hidden'}}>
        <table>
          <thead>
            <tr style={{borderBottom:`1px solid ${T.border}`,color:T.text4}}>

function SkillForm({initial,executorTypes,onSave}) {

           <Field label="显示名称" value={d.display_name||''} onChange={f('display_name')} disabled={isBuiltin}/></Row>

        <div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6,opacity:isBuiltin?0.6:1}}>

// ── 知识库 ───────────────────────────────────────────────────
function KBTab() {
  const [entries,setEntries] = useState([]);
  const [total,setTotal] = useState(0);
  const [page,setPage] = useState(1);
  const [search,setSearch] = useState('');
  const [form,setForm] = useState(null);
  const [viewing,setViewing] = useState(null);
  const [importModal, setImportModal] = useState(false);
  const [importing, setImporting] = useState(false);

  const load = useCallback(()=>{
    const q = new URLSearchParams({page:String(page),limit:'20',...(search?{search}:{})});
    api(`/kb?${q}`).then(r=>{setEntries(r.items);setTotal(r.total)}).catch(e=>window.__showToast?.(e.message));
  },[page,search]);
  useEffect(()=>{load()},[load]);

  const handleImportDir = async (dirPath) => {
    setImporting(true);
    try {
      await api('/kb/import-dir', {method:'POST', body:JSON.stringify({dirPath})});
      window.__showToast?.('目录已导入','ok');
      setImportModal(false);
      load();
    } catch(e) {
      window.__showToast?.(e.message,'error');
    }
    setImporting(false);
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <H1>知识库管理</H1>
        <div style={{display:'flex',gap:8}}>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1)}} placeholder="搜索标题/内容..."
            style={{background:T.bg2,border:`1px solid ${T.border}`,color:T.text2,padding:'6px 12px',borderRadius:6,fontSize:13,width:200}}/>
          <Btn onClick={()=>setForm({entry_type:'code',language:'go',quality_score:70})}>+ 添加条目</Btn>
          <Btn onClick={()=>setImportModal(true)} style={{background:T.bg3,color:T.text2}}>📁 导入目录</Btn>
        </div>
      </div>
      <div style={{fontSize:12,color:T.text4,marginBottom:12}}>共 {total} 条</div>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {entries.length===0&&total===0&&<div style={{color:T.text3,padding:32,textAlign:'center',background:T.bg2,borderRadius:8,border:`1px solid ${T.border}`}}>暂无知识库条目，点击右上角「+ 添加条目」</div>}
        {entries.map(e=>(
          <div key={e.id} style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                <span style={{color:T.text1,fontWeight:500}}>{e.title}</span>
                {e.language&&<Tag color={T.blue}>{e.language}</Tag>}
                <Tag color={T.text4}>{e.entry_type}</Tag>
                <span style={{fontSize:11,color:parseInt(e.quality_score)>=70?T.green:T.amber}}>质量 {e.quality_score}</span>
              </div>
              <div style={{fontSize:11,color:T.text4,fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(e.content_preview||'').slice(0,80)}...</div>
            </div>
            <div style={{display:'flex',gap:6,flexShrink:0}}>
              <SmallBtn onClick={async()=>{const full=await api(`/kb/${e.id}`);setViewing(full)}}>查看</SmallBtn>
              <SmallBtn onClick={()=>setForm(e)}>编辑</SmallBtn>
              <SmallBtn style={{color:T.red}} onClick={async()=>{if(confirm('确认删除？')){await api(`/kb/${e.id}`,{method:'DELETE'});load()}}}>删除</SmallBtn>
            </div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}>
        {page>1&&<SmallBtn onClick={()=>setPage(p=>p-1)}>上一页</SmallBtn>}
        <span style={{padding:'4px 8px',fontSize:12,color:T.text4}}>{page} / {Math.ceil(total/20)||1}</span>
        {page<Math.ceil(total/20)&&<SmallBtn onClick={()=>setPage(p=>p+1)}>下一页</SmallBtn>}
      </div>
      {form&&(
        <Modal title={form.id?'编辑条目':'添加知识库条目'} onClose={()=>setForm(null)} wide>
          <KBForm initial={form} onSave={async(d)=>{
            if(form.id) await api(`/kb/${form.id}`,{method:'PUT',body:JSON.stringify(d)});
            else await api('/kb',{method:'POST',body:JSON.stringify(d)});
            setForm(null);load();
          }}/>
        </Modal>
      )}
      {viewing&&(
        <Modal title={viewing.title} onClose={()=>setViewing(null)} wide>
          <pre style={{background:T.bg0,border:`1px solid ${T.border}`,borderRadius:6,padding:16,fontSize:12,color:T.text2,overflow:'auto',maxHeight:400,whiteSpace:'pre-wrap',fontFamily:'monospace'}}>{viewing.content}</pre>
        </Modal>
      )}
      {importModal&&(
        <Modal title="从本地目录导入" onClose={()=>setImportModal(false)} wide>
          <ImportDirForm onImport={handleImportDir} importing={importing}/>
        </Modal>
      )}
    </div>
  );
}

  useEffect(() => { loadPipelines(); }, []);

  async function loadPipelines() {
    try {
      const data = await api('/pipelines');
      setPipelines(Array.isArray(data) ? data : []);
    } catch(e) {
      window.showGlobalToast(e.message, 'error');
    }
    setLoading(false);

  async function createPipeline() {
    if (!form.name) { window.showGlobalToast('缺少流水线名称', 'error'); return; }
    if (!form.nodes || form.nodes.length === 0) {
      window.showGlobalToast('流水线必须至少包含一个节点', 'error');
      return;

    try {
      await api('/pipelines', {method:'POST',body:JSON.stringify(form)});

function SettingsTab() {
  const [settings,setSettings] = useState([]);
  const [editing,setEditing] = useState(null);
  const [editVal,setEditVal] = useState('');
  const load = () => api('/settings').then(d=>{setSettings(d);}).catch(e=>window.__showToast?.(e.message));
  useEffect(()=>{load()},[]);

  const envEnabledSetting = settings.find(s => s.key === 'use_env_config');
  const envEnabled = envEnabledSetting ? (envEnabledSetting.value === true || envEnabledSetting.value === 'true') : false;

  const save = async key => {
    let value = editVal;
    try{value=JSON.parse(editVal)}catch{}
    await api(`/settings/${key}`,{method:'PUT',body:JSON.stringify({value})});
    setEditing(null);load();window.__showToast?.('已保存','ok');
  };

  const toggleEnv = async () => {
    try {
      await api('/settings/use_env_config', {method:'PUT',body:JSON.stringify({value:!envEnabled})});
      load();
      window.__showToast?.('已保存','ok');
    } catch(e) {
      window.__showToast?.(e.message,'error');
    }
  };

  const byCategory = settings.filter(s=>s.key!=='use_env_config').reduce((acc,s)=>{
    if(!acc[s.category])acc[s.category]=[];
    acc[s.category].push(s);
    return acc;
  },{});

  return (
    <div>
      <H1>系统设置</H1>

      {/* 配置源总开关 */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:24}}>
        <div onClick={()=>envEnabled&&toggleEnv()}
          style={{background:T.bg2,border:`2px solid ${!envEnabled?T.blue:T.border}`,borderRadius:8,padding:'16px',cursor:'pointer',transition:'all 0.2s',opacity:!envEnabled?1:0.5}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <span style={{fontSize:14,color:T.text1,fontWeight:500}}>📄 后台管理配置</span>
            {!envEnabled&&<Tag color={T.green}>当前</Tag>}
          </div>
          <div style={{fontSize:12,color:T.text4}}>从数据库读取系统设置（推荐用于生产）</div>
        </div>
        <div onClick={()=>!envEnabled&&toggleEnv()}
          style={{background:T.bg2,border:`2px solid ${envEnabled?T.blue:T.border}`,borderRadius:8,padding:'16px',cursor:'pointer',transition:'all 0.2s',opacity:envEnabled?1:0.5}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
            <span style={{fontSize:14,color:T.text1,fontWeight:500}}>.env 文件配置</span>
            {envEnabled&&<Tag color={T.green}>当前</Tag>}
          </div>
          <div style={{fontSize:12,color:T.text4}}>从 .env 文件读取配置（仅用于测试）</div>
        </div>
      </div>

      {settings.length===0?<div style={{color:T.text3,padding:40,textAlign:'center',background:T.bg2,borderRadius:8,border:`1px solid ${T.border}`}}>暂无设置数据，请确认数据库已初始化（执行 infra/postgres/dynamic-config-schema.sql）</div>:
      Object.entries(byCategory).map(([cat,items])=>(
        <Card key={cat} title={catLabel(cat)} style={{marginBottom:16}}>
          {items.map(s=>{
            const isBool = typeof s.value === 'boolean' || s.value === 'true' || s.value === 'false';
            const boolVal = s.value === true || s.value === 'true';
            return (
            <div key={s.key} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${T.border}`}}>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:T.text1,fontFamily:'monospace'}}>{s.key}</div>
                {s.description&&<div style={{fontSize:11,color:T.text4}}>{s.description}</div>}
              </div>
              {isBool?(
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <Toggle on={boolVal} onToggle={async()=>{try{await api(`/settings/${s.key}`,{method:'PUT',body:JSON.stringify({value:!boolVal})});load();window.__showToast?.('已保存','ok')}catch(e){window.__showToast?.(e.message,'error')}}}/>
                </div>
              ):editing===s.key?(
                <div style={{display:'flex',gap:6}}>
                  <input value={editVal} onChange={e=>setEditVal(e.target.value)}
                    style={{background:T.bg0,border:`1px solid ${T.border}`,color:T.text2,padding:'4px 8px',borderRadius:4,fontSize:12,width:180}}/>
                  <SmallBtn style={{color:T.green}} onClick={()=>save(s.key)}>保存</SmallBtn>
                  <SmallBtn onClick={()=>setEditing(null)}>取消</SmallBtn>
                </div>
              ):(
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <code style={{fontSize:12,color:T.amber,background:T.bg0,padding:'2px 6px',borderRadius:3}}>{JSON.stringify(s.value)}</code>
                  <SmallBtn onClick={()=>{setEditing(s.key);setEditVal(typeof s.value==='string'?s.value:JSON.stringify(s.value))}}>改</SmallBtn>
                </div>
              )}
            </div>
            );
          })}
        </Card>
      ))}
    </div>
  );
}

};

  {value:'error',label:'异常'},
  {value:'failed',label:'失败'},
  {value:'auto_fix_1',label:'自动修复中'},
];

function StatusBadge({status}) {
  const s = STATUS_LABELS[status]||{label:status,color:T.text4};
  return <Tag color={s.color}>{s.label}</Tag>;
}
function PriorityBadge({priority}) {
  const color = priority==='P0'?T.red:priority==='P1'?T.amber:T.text4;
  return <Tag color={color}>{priority||'—'}</Tag>;
}
function fmtDuration(started, completed) {
  if (!started) return '—';
  const sec = Math.round(((completed?new Date(completed):new Date()) - new Date(started))/1000);
  if (sec<60) return sec+'s';
  return Math.floor(sec/60)+'m'+(sec%60)+'s';
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

        <div>
          <div style={{fontSize:11,color:T.text4,marginBottom:8,textTransform:'uppercase',fontWeight:600}}>
            生成文件 ({files.length} 个)
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {files.map((f,i)=>(
              <div key={i} style={{background:T.bg0,border:`1px solid ${T.border}`,borderRadius:5}}>
                <div onClick={()=>setExpandFile(expandFile===f.path?null:f.path)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',cursor:'pointer'}}>
                  <Tag color={f.language==='go'?T.blue:f.language==='typescript'?T.green:T.purple}>{f.language||'?'}</Tag>
                  <span style={{flex:1,fontSize:12,color:T.text2,fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.path}</span>
                  <Tag color={T.text4}>{f.role}</Tag>
                  <span style={{fontSize:10,color:T.text4}}>{(f.content||'').split('\n').length} 行</span>
                  <span style={{fontSize:10,color:T.text4}}>{expandFile===f.path?'▲':'▼'}</span>
                </div>
                {expandFile===f.path&&(
                  <pre style={{margin:0,padding:'8px 12px',background:T.bg1,borderTop:`1px solid ${T.border}`,fontSize:11,color:T.text2,overflow:'auto',maxHeight:320,fontFamily:'monospace',whiteSpace:'pre-wrap'}}>
                    {(f.content||'').slice(0,4000)}{(f.content||'').length>4000?'\n...(内容已截断)':''}
                  </pre>
                )}
              </div>
            ))}
          </div>
        </div>
      )}

      {task.error_log&&(
        <div>
          <div style={{fontSize:11,color:T.red,marginBottom:6,textTransform:'uppercase',fontWeight:600}}>错误日志</div>
          <pre style={{background:'#1a0808',border:'1px solid #5a1a1a',borderRadius:5,padding:'10px 14px',fontSize:11,color:'#ff8888',fontFamily:'monospace',whiteSpace:'pre-wrap',maxHeight:200,overflow:'auto'}}>
            {task.error_log}
          </pre>
        </div>
      )}

      <div style={{fontSize:11,color:T.text4,fontFamily:'monospace',borderTop:`1px solid ${T.border}`,paddingTop:10}}>
        task: {task.id} · spec: {task.spec_id||'—'} · project: {task.project_id||'—'}
      </div>
    </div>
  );
}

function TasksTab() {
  const [tasks,setTasks]       = useState([]);
  const [total,setTotal]       = useState(0);
  const [page,setPage]         = useState(1);
  const [status,setStatus]     = useState('');
  const [search,setSearch]     = useState('');
  const [statsMap,setStatsMap] = useState({});
  const [detail,setDetail]     = useState(null);
  const [loading,setLoading]   = useState(false);
  const [selected,setSelected] = useState(new Set());
  const [err,setErr]           = useState('');

  const loadStats = () =>
    api('/tasks/stats').then(d=>setStatsMap(d.byStatus||{})).catch(()=>{});

  const load = useCallback(()=>{
    setLoading(true); setErr('');
    const q = new URLSearchParams({page:String(page),limit:'20',
      ...(status?{status}:{}), ...(search?{search}:{})});
    api(`/tasks?${q}`)
      .then(d=>{setTasks(d.items);setTotal(d.total);setSelected(new Set());})
      .catch(e=>setErr(e.message))
      .finally(()=>setLoading(false));
  },[page,status,search]);

  useEffect(()=>{loadStats()},[]);
  useEffect(()=>{load()},[load]);

  const openDetail = async id=>{
    try{setDetail(await api(`/tasks/${id}`));}catch(e){setErr(e.message);}
  };
  const cancelTask = async id=>{
    try{await api(`/tasks/${id}/cancel`,{method:'POST'});load();loadStats();}catch(e){setErr(e.message);}
  };
  const deleteTask = async id=>{
    if(!confirm('确认永久删除此任务及关联数据？'))return;
    try{await api(`/tasks/${id}`,{method:'DELETE'});load();loadStats();}catch(e){setErr(e.message);}
  };
  const batchDelete = async delStatus=>{
    const ids = delStatus?undefined:Array.from(selected);
    const label = delStatus?`所有"${STATUS_LABELS[delStatus]?.label||delStatus}"任务`:`选中的 ${ids?.length} 个任务`;
    if(!confirm(`确认永久删除${label}？此操作不可撤销。`))return;
    try{
      const d=await api('/tasks/batch-delete',{method:'POST',body:JSON.stringify(delStatus?{status:delStatus}:{ids})});
      window.__showToast?.(`已删除 ${d.deleted} 个任务`,'ok');
      load();loadStats();
    }catch(e){setErr(e.message);}
  };

  const toggleSel = id=>setSelected(prev=>{const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;});
  const allChecked = tasks.length>0&&tasks.every(t=>selected.has(t.id));
  const toggleAll  = ()=>setSelected(allChecked?new Set():new Set(tasks.map(t=>t.id)));

  const statBar = [
    {key:'running',       label:'执行中',  color:'#f59e0b'},
    {key:'test_pass',     label:'待Review',color:'#4ade80'},
    {key:'manual_review', label:'需人工',  color:'#f59e0b'},
    {key:'human_accepted',label:'已接受',  color:'#4ade80'},
    {key:'human_rejected',label:'已拒绝',  color:'#f87171'},
    {key:'error',         label:'异常',    color:'#f87171'},
    {key:'failed',        label:'失败',    color:'#f87171'},
  ];
  const totalCount=Object.values(statsMap).reduce((s,n)=>s+(parseInt(n)||0),0);

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <H1>代码生成任务</H1>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {selected.size>0&&(
            <Btn onClick={()=>batchDelete()} style={{background:'#2a1010',borderColor:'#5a2020',color:T.red}}>
              删除选中 ({selected.size})
            </Btn>
          )}
          <SmallBtn onClick={()=>batchDelete('error')} style={{color:T.red}}>清理异常</SmallBtn>
          <SmallBtn onClick={()=>batchDelete('human_rejected')} style={{color:T.red}}>清理已拒绝</SmallBtn>
          <SmallBtn onClick={()=>{load();loadStats();}}>刷新</SmallBtn>
        </div>
      </div>

      {/* 状态统计卡片 */}
      <div style={{display:'grid',gridTemplateColumns:`repeat(${statBar.length+1},1fr)`,gap:8,marginBottom:16}}>
        <div onClick={()=>{setStatus('');setPage(1);}}
          style={{background:status===''?T.bg3:T.bg2,border:`1px solid ${status===''?T.blue:T.border}`,borderRadius:6,padding:'10px 12px',cursor:'pointer'}}>
          <div style={{fontSize:22,fontWeight:700,color:T.text1}}>{totalCount}</div>
          <div style={{fontSize:11,color:T.text4,marginTop:2}}>全部</div>
        </div>
        {statBar.map(s=>(
          <div key={s.key} onClick={()=>{setStatus(s.key);setPage(1);}}
            style={{background:status===s.key?T.bg3:T.bg2,border:`1px solid ${status===s.key?s.color:T.border}`,borderRadius:6,padding:'10px 12px',cursor:'pointer'}}>
            <div style={{fontSize:22,fontWeight:700,color:s.color}}>{statsMap[s.key]||0}</div>
            <div style={{fontSize:11,color:T.text4,marginTop:2}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* 过滤栏 */}
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
        <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="搜索功能名称..."
          style={{flex:1,background:T.bg2,border:`1px solid ${T.border}`,color:T.text2,padding:'7px 12px',borderRadius:6,fontSize:13}}/>
        <select value={status} onChange={e=>{setStatus(e.target.value);setPage(1);}}
          style={{background:T.bg2,border:`1px solid ${T.border}`,color:T.text2,padding:'7px 12px',borderRadius:6,fontSize:13}}>
          {STATUS_OPTS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
        <span style={{fontSize:12,color:T.text4,whiteSpace:'nowrap'}}>共 {total} 条</span>
      </div>

      {err&&<div style={{color:T.red,fontSize:12,marginBottom:8,padding:'6px 10px',background:'#2a0808',borderRadius:4}}>⚠ {err}</div>}

      {/* 任务表格 */}
      <div style={{background:T.bg2,border:`1px solid ${T.border}`,borderRadius:8,overflow:'hidden'}}>
        <table>
          <thead>
            <tr style={{borderBottom:`1px solid ${T.border}`,color:T.text4}}>
              <th style={{padding:'8px 12px',width:32}}>
                <input type="checkbox" checked={allChecked} onChange={toggleAll} style={{cursor:'pointer',accentColor:T.blue}}/>
              </th>
              {['功能名称','状态','优先级','耗时','重试','评分','创建时间','操作'].map(h=>(
                <th key={h} style={{padding:'8px 12px',textAlign:'left',fontWeight:600,fontSize:11,textTransform:'uppercase',letterSpacing:'0.05em'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {loading&&<tr><td colSpan={9} style={{padding:32,textAlign:'center',color:T.text4}}>加载中...</td></tr>}
            {!loading&&tasks.length===0&&<tr><td colSpan={9} style={{padding:32,textAlign:'center',color:T.text4}}>暂无任务记录</td></tr>}
            {tasks.map(t=>(
              <tr key={t.id} style={{borderBottom:`1px solid ${T.border}`,background:selected.has(t.id)?T.bg3:'transparent'}}>
                <td style={{padding:'8px 12px'}}>
                  <input type="checkbox" checked={selected.has(t.id)} onChange={()=>toggleSel(t.id)} style={{cursor:'pointer',accentColor:T.blue}}/>
                </td>
                <td style={{padding:'8px 12px',maxWidth:200}}>
                  <div style={{color:T.text1,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                    {t.spec_title||<span style={{color:T.text4}}>(无标题)</span>}
                  </div>
                  <div style={{fontSize:10,color:T.text4,fontFamily:'monospace',marginTop:2}}>{t.id.slice(0,8)}…</div>
                </td>
                <td style={{padding:'8px 12px'}}><StatusBadge status={t.status}/></td>
                <td style={{padding:'8px 12px'}}><PriorityBadge priority={t.priority}/></td>
                <td style={{padding:'8px 12px',color:T.text3,fontSize:12}}>{fmtDuration(t.started_at,t.completed_at)}</td>
                <td style={{padding:'8px 12px'}}>
                  {parseInt(t.retry_count)>0?<Tag color={T.purple}>{t.retry_count}次</Tag>:<span style={{color:T.text4}}>—</span>}
                </td>
                <td style={{padding:'8px 12px'}}>
                  {t.total_score!=null
                    ?<span style={{color:parseInt(t.total_score)>=70?T.green:T.amber,fontWeight:600}}>{t.total_score}</span>
                    :<span style={{color:T.text4}}>—</span>}
                </td>
                <td style={{padding:'8px 12px',color:T.text3,fontSize:11}}>{fmtTime(t.created_at)}</td>
                <td style={{padding:'8px 12px'}}>
                  <div style={{display:'flex',gap:4}}>
                    <SmallBtn onClick={()=>openDetail(t.id)}>详情</SmallBtn>
                    {['running','generated','auto_fix_1','auto_fix_2','auto_fix_3'].includes(t.status)&&(
                      <SmallBtn onClick={()=>cancelTask(t.id)} style={{color:T.amber}}>取消</SmallBtn>
                    )}
                    <SmallBtn onClick={()=>deleteTask(t.id)} style={{color:T.red}}>删除</SmallBtn>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* 分页 */}
      {total>20&&(
        <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:8,marginTop:12}}>
          <SmallBtn onClick={()=>setPage(p=>p-1)} disabled={page<=1}>上一页</SmallBtn>
          <span style={{fontSize:12,color:T.text4}}>{page} / {Math.ceil(total/20)}</span>
          <SmallBtn onClick={()=>setPage(p=>p+1)} disabled={page>=Math.ceil(total/20)}>下一页</SmallBtn>
        </div>
      )}

      {detail&&(
        <Modal title={`任务详情 — ${detail.spec_title||detail.id.slice(0,8)}`} onClose={()=>setDetail(null)} wide>
          <TaskDetail task={detail}/>
        </Modal>
      )}
    </div>
  );
}

// ── 主应用 ───────────────────────────────────────────────────
const NAV = [
  {key:'overview',label:'总览',icon:'◈'},
  {key:'tasks',  label:'生成任务',icon:'📋'},
  {key:'llm',    label:'LLM 配置',icon:'⚡'},
  {key:'skills', label:'Skills',  icon:'🔧'},
  {key:'agents', label:'Agents',  icon:'🤖'},
  {key:'pipelines',label:'流水线',icon:'⚙️'},
  {key:'kb',     label:'知识库',  icon:'📚'},
  {key:'settings',label:'系统设置',icon:'⚙️'},
];

function App() {
  const [tab,setTab] = useState('overview');
  const [stats,setStats] = useState(null);
  const [toast,setToast] = useState(null);  // {msg, type: 'error'|'ok'}

  // 全局 toast 通知（3s 自动消失）
  const showToast = (msg, type='error') => {
    setToast({msg,type});
    setTimeout(()=>setToast(null), 4000);
  };
  // 挂到 window 让各 Tab 调用
  window.__showToast = showToast;
  const [apiKey,setApiKey] = useState(localStorage.getItem('awp_admin_key')||'');
  const [keyInput,setKeyInput] = useState('');
  const [showKeyInput,setShowKeyInput] = useState(false);

  useEffect(()=>{
    api('/stats').then(setStats).catch(()=>{});
  },[]);

  const saveKey = () => {
    localStorage.setItem('awp_admin_key',keyInput);
    window.location.reload();
  };

  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* 侧边栏 */}
      <nav style={{width:200,background:T.bg1,borderRight:`1px solid ${T.border}`,display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{padding:'16px 20px',borderBottom:`1px solid ${T.border}`}}>
          <div style={{fontFamily:'monospace',fontSize:12,background:T.blueBg,color:T.blue,border:`1px solid ${T.blueBorder}`,padding:'3px 8px',borderRadius:4,display:'inline-block',letterSpacing:'0.1em'}}>AWP</div>
          <div style={{fontSize:12,color:T.text4,marginTop:6}}>管理后台</div>
        </div>
        {NAV.map(n=>(
          <button key={n.key} onClick={()=>setTab(n.key)} style={{display:'flex',alignItems:'center',gap:8,padding:'10px 20px',background:tab===n.key?T.bg2:'transparent',border:'none',borderLeft:`3px solid ${tab===n.key?T.blue:'transparent'}`,color:tab===n.key?T.text1:T.text3,cursor:'pointer',textAlign:'left',fontSize:13,width:'100%'}}>
            <span>{n.icon}</span> {n.label}
          </button>
        ))}
        <div style={{marginTop:'auto',padding:'12px 20px',borderTop:`1px solid ${T.border}`}}>
          {showKeyInput?(
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="Admin Key" type="password"
                style={{background:T.bg0,border:`1px solid ${T.border}`,color:T.text2,padding:'4px 8px',borderRadius:4,fontSize:11}}/>
              <div style={{display:'flex',gap:4}}>
                <SmallBtn onClick={saveKey} style={{fontSize:10,color:T.green}}>保存</SmallBtn>
                <SmallBtn onClick={()=>setShowKeyInput(false)} style={{fontSize:10}}>取消</SmallBtn>
              </div>
            </div>
          ):(
            <SmallBtn onClick={()=>{setShowKeyInput(true);setKeyInput(apiKey)}} style={{fontSize:10,width:'100%'}}>
              {apiKey?'修改 Admin Key':'设置 Admin Key'}
            </SmallBtn>
          )}
        </div>
      </nav>
      {/* 主内容 */}
      <main style={{flex:1,overflow:'auto',padding:24,background:T.bg0}}>
        {tab==='overview'&&<OverviewTab stats={stats}/>}
        {tab==='tasks'&&<TasksTab/>}
        {tab==='llm'&&<LLMTab/>}
        {tab==='skills'&&<SkillsTab/>}
        {tab==='agents'&&<AgentsTab/>}
        {tab==='pipelines'&&<PipelinesTab/>}
        {tab==='kb'&&<KBTab/>}
        {tab==='settings'&&<SettingsTab/>}
      </main>
      {toast&&(
        <div style={{position:'fixed',bottom:24,right:24,padding:'10px 18px',borderRadius:8,
          background:toast.type==='ok'?T.greenBg:T.bg2,
          border:`1px solid ${toast.type==='ok'?T.greenBorder:T.red}`,
          color:toast.type==='ok'?T.green:T.red,fontSize:13,zIndex:2000,
          boxShadow:'0 4px 20px #0006',maxWidth:400}}>
          {toast.type==='ok'?'✅ ':''}{toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
